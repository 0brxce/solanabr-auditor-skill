name: Sync from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        run: |
          git remote add upstream https://github.com/solanabr/auditor-skill.git || \
            git remote set-url upstream https://github.com/solanabr/auditor-skill.git

          git fetch upstream main
          git merge -X ours --no-edit upstream/main
          git checkout HEAD -- .github/workflows/
          git push origin main
